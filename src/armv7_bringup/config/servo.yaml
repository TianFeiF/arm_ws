# MoveIt Servo config for the armv7 arm (real-time Cartesian jog in POSITION mode).
#
# The rqt panel's "笛卡尔 jog" tab publishes geometry_msgs/TwistStamped to
# ~/delta_twist_cmds; servo solves IK (KDL), handles singularities / joint
# limits, and streams a JointTrajectory to the active plan_group_controller
# (JTC). Only meaningful while the JTC is active (= position mode); in force
# mode the JTC is inactive so servo's output is ignored.
#
# Loaded under the "moveit_servo" namespace by unified.launch.py, alongside
# robot_description / _semantic / _kinematics.
###############################################
use_gazebo: false

## Incoming command properties.
# speed_units: twist linear is m/s, angular is rad/s (we send real velocities
# straight from the panel's speed spinboxes -- no unitless scaling needed).
command_in_type: "speed_units"
scale:
  # Only used when command_in_type == "unitless"; kept as a safety ceiling.
  linear: 0.10
  rotational: 0.5
  joint: 0.5

## Outgoing command properties.
publish_period: 0.02            # 50 Hz servo loop
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true   # JTC claims position + velocity -> publish both
publish_joint_velocities: true
publish_joint_accelerations: false

smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# move_group owns the primary planning scene; servo is a secondary monitor that
# reads it via /get_planning_scene (move_group runs in the same bringup).
is_primary_planning_scene_monitor: false

## MoveIt properties (armv7-specific).
move_group_name: plan_group
planning_frame: base_link
ee_frame_name: link7
robot_link_command_frame: base_link   # twist header frame_id selects base/tool

## Stopping behaviour.
incoming_command_timeout: 0.15        # halt if no twist for this long (panel ~50 Hz)
num_outgoing_halt_msgs_to_publish: 4

## Singularity / joint-limit handling. The 7-DoF arm at q=0 (straight up) is
## singular -- servo decelerates/halts near it; jog away in joint space first.
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.1
leaving_singularity_threshold_multiplier: 2.0

## Topic names.
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /plan_group_controller/joint_trajectory

## Collision checking (uses move_group's planning scene).
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
